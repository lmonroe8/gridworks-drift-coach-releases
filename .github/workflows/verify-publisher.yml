name: Verify release publisher
on:
  push:
    paths:
      - scripts/publish_assets.py
      - scripts/test_publish_assets.py
      - .github/workflows/verify-publisher.yml
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s scripts -p 'test_publish_assets.py' -v
        env:
          GH_TOKEN: test-token-never-forward
